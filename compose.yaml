name: fokus-law-synthetic

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./docker.env.example
        required: true
      - path: ./docker.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - law-synthetic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./docker.env.example
        required: true
      - path: ./docker.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    networks:
      - law-synthetic
    restart: unless-stopped

  db:
    image: mysql:8.4.13
    env_file:
      - path: ./docker.env.example
        required: true
      - path: ./docker.env
        required: false
    volumes:
      - law-synthetic-db:/var/lib/mysql
    networks:
      - law-synthetic
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

networks:
  law-synthetic:
    internal: true

volumes:
  law-synthetic-db:
