<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Signed confirmation links use query strings as short-lived bearer tokens.
    # Log only the path so query parameters and referrers are not written to disk.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" fokus_safe
    CustomLog ${APACHE_LOG_DIR}/access.log fokus_safe
</VirtualHost>
