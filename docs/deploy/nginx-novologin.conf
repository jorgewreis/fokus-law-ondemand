# Trecho para o vhost do site law.ios1vcrime.com.br no CloudPanel.
# O document root do site continua current/public.
# Não coloque senha, certificado ou socket inventado: use o fastcgi_pass
# que o CloudPanel já gravou neste vhost.
# A raiz / da origem redireciona para /novologin/.

location = / {
    return 302 /novologin/;
}

location = /novologin {
    return 302 /novologin/;
}

# Assets versionados em /novologin/build/: cache longo e prefixo ^~
# (ganha da location regex genérica de estáticos do CloudPanel).
location ^~ /novologin/build/ {
    root /home/law-ondemand/htdocs/law.ios1vcrime.com.br/current/public;
    rewrite ^/novologin/(.*)$ /$1 break;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# PHP nunca é entregue como arquivo. Tudo cai no index.php, com a URI original.
# sub_filter torna absolutos do host público em caminhos de raiz, para o CSP
# 'self' valer tanto no host público quanto no hostname da origem.
location ^~ /novologin/ {
    root /home/law-ondemand/htdocs/law.ios1vcrime.com.br/current/public;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/law-ondemand/htdocs/law.ios1vcrime.com.br/current/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        # fastcgi_pass unix:/CAMINHO-DO-SOCKET-JA-USADO-PELO-SITE;
        sub_filter_once off;
        sub_filter 'https://ios1vcrime.com.br' '';
    }

    rewrite ^/novologin/(.*)$ /$1 break;
    try_files $uri @novologin;
}

location @novologin {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/law-ondemand/htdocs/law.ios1vcrime.com.br/current/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param HTTPS on;
    # fastcgi_pass unix:/CAMINHO-DO-SOCKET-JA-USADO-PELO-SITE;
    sub_filter_once off;
    sub_filter 'https://ios1vcrime.com.br' '';
}
